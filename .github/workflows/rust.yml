name: rust

on:
  push:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "docs/design/contextual/tokens.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "docs/design/contextual/tokens.json", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  agent-musl:
    name: contextual-agent (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p contextual-agent --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-agent-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/contextual-agent

  no-hardcoded-styles:
    name: theme rule (no literal colours in the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject literal colours outside crates/theme
        run: |
          if [ -d crates/app ] && grep -rnE '\b(rgb|rgba|hsla)\(|#[0-9a-fA-F]{6}\b' crates/app/src; then
            echo "Use contextual-theme tokens instead of literal colours."; exit 1
          fi
