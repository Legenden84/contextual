name: rust

on:
  push:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "docs/design/contextual/tokens.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "docs/design/contextual/tokens.json", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GUI libraries for the GPUI app (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  app-release:
    name: contextual app release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: agent-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release builds precompile the DirectX shaders with fxc.exe, so Windows releases build here.
      - run: cargo build -p contextual --release --locked
      # The Windows app deploys these into WSL distros; it looks for them next to contextual.exe.
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          pattern: contextual-agent-*-linux
          merge-multiple: true
          path: target/release
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-${{ runner.os }}
          path: |
            target/release/contextual.exe
            target/release/contextual-agent-*-linux
            target/release/contextual

  agent-musl:
    name: contextual-agent (${{ matrix.arch }}-unknown-linux-musl)
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Static and pure Rust (no HTTP/TLS in the agent), so no musl C toolchain is needed.
      - run: cargo build -p contextual-agent --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - run: cp target/${{ matrix.arch }}-unknown-linux-musl/release/contextual-agent contextual-agent-${{ matrix.arch }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-agent-${{ matrix.arch }}-linux
          path: contextual-agent-${{ matrix.arch }}-linux

  no-hardcoded-styles:
    name: theme rule (no literal colours in the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject literal colours outside crates/theme
        run: |
          if [ -d crates/app ] && grep -rnE '\b(rgba?|hsla)\(\s*(0x|[0-9.])|#[0-9a-fA-F]{6}\b' crates/app/src; then
            echo "Use contextual-theme tokens instead of literal colours."; exit 1
          fi
