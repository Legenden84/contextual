[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/theme", "crates/agent"]
# crates/app (GPUI) is added in Phase 1 and built only on Windows and macOS.
default-members = ["crates/core", "crates/protocol", "crates/theme", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
contextual-core = { path = "crates/core" }
contextual-protocol = { path = "crates/protocol" }
contextual-theme = { path = "crates/theme" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
directories = "6"
dunce = "1"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = "symbols"
