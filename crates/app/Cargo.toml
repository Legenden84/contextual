[package]
name = "contextual"
description = "Contextual: the native desktop app (GPUI). Windows and macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contextual-core = { workspace = true }
contextual-protocol = { workspace = true }
contextual-theme = { workspace = true }
# GPUI and its component library, as one matched pair: gpui-kit pins gpui-pre =0.3.11.
# Upgrade deliberately (plan §12), never with a floating version.
gpui-kit = { version = "=0.9.0", features = ["tree-sitter-languages"] }
# Feature unification makes gpui-kit-assets embed its default icons in debug builds too.
# Otherwise cross-compiled executables try to read icons from the build machine's registry.
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
anyhow = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
# OS keychain for the API key: Keychain (macOS), Credential Manager (Windows), Secret Service.
keyring = "4"
time = { workspace = true, features = ["local-offset"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# gpui-component ships the C# grammar without a highlights query; we register the grammar's own
# (same versions as gpui-component resolves).
tree-sitter = "0.26"
tree-sitter-c-sharp = "0.23"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# Kills the WSL agents with the app, even on a crash.
win32job = "2"

[lints]
workspace = true
