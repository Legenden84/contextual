[package]
name = "contextual-core"
description = "Headless Contextual logic: workspace (files, scan, apply, git, PRs), LLM, threads, settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Azure AI Foundry client and settings (app only). The WSL agent builds without it: no TLS/HTTP stack.
default = ["llm"]
llm = ["dep:reqwest"]

[dependencies]
contextual-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
directories = { workspace = true }
dunce = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
hex = { workspace = true }
ignore = { workspace = true }
image = { workspace = true }
md-5 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# M2.3 Windows backend; normal startup still selects none. `process-wrap` starts the
# process suspended, assigns it to a job object and resumes it; `win32job` supplies the
# job whose member list confirms cleanup; `windows` only names the creation flag.
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "job-object", "creation-flags"] }
win32job = "2"
windows = { version = "0.62", features = ["Win32_System_Threading"] }

# M2.1 native Unix backends; normal startup still selects none.
# `net` supplies Tokio's anonymous pipes, created and registered before the launch.
# `fs` supplies `flock`, the cross-process project ownership lock (M3).
[target.'cfg(all(target_os = "linux", not(target_env = "uclibc")))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal", "fs"] }
tokio = { workspace = true, features = ["net"] }

# `event` supplies kqueue, the non-reaping root observation on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal", "event", "fs"] }
tokio = { workspace = true, features = ["net"] }
