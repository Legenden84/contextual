[package]
name = "contextual-agent"
description = "Headless workspace host for WSL: JSON-RPC 2.0 over stdio around contextual-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contextual-core = { workspace = true, default-features = false }
contextual-protocol = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Verification harness for approved command execution (plan milestone M4). It is built
# with the package so that tests can start it, but it is never deployed: only
# `contextual-agent` is bundled with the app.
[[bin]]
name = "contextual-agent-execution-harness"
path = "src/bin/execution_harness.rs"
test = false

[lints]
workspace = true

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
